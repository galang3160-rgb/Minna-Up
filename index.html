<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nakama Gakkou</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- SPLASH SCREEN -->
  <div id="splash">
    <div class="splash-box">
      <svg class="checkmark-svg" viewBox="0 0 52 52">
        <circle class="checkmark-circle" cx="26" cy="26" r="22" fill="none"/>
        <path class="checkmark-check" fill="none" d="M15 27l7 7 15-15"/>
      </svg>
    </div>
    <h1 class="splash-title">Nakama<b>Gakkou</b></h1>
  </div>

  <!-- EFEK INTERAKTIF & MOUSE TRAIL -->
  <div class="sun" id="sun" aria-hidden="true"></div>
  <div class="fx" id="fx" aria-hidden="true"></div>
  <canvas id="trail"></canvas>

  <main>
    <!-- VIEW 1: 4 MENU UTAMA (ANGKA, KANJI, KOTOBA, PEMULA) -->
    <section class="view active" id="viewMain">
      <div class="bento-grid grid-4">

        <!-- 1. ANGKA -->
        <a href="Angka/index.html" class="neo-card card-angka tile-link" data-tilt>
          <span class="card-index">01</span>
          <div class="icon-box">
            <!-- Ikon Abacus / Grid Angka -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="3" width="16" height="18" rx="3"/>
              <line x1="8" y1="7" x2="16" y2="7"/>
              <circle cx="8.5" cy="12" r="1" fill="currentColor"/>
              <circle cx="12" cy="12" r="1" fill="currentColor"/>
              <circle cx="15.5" cy="12" r="1" fill="currentColor"/>
              <circle cx="8.5" cy="16" r="1" fill="currentColor"/>
              <circle cx="12" cy="16" r="1" fill="currentColor"/>
              <circle cx="15.5" cy="16" r="1" fill="currentColor"/>
            </svg>
          </div>
          <div class="card-footer">
            <h2 class="card-title">Angka</h2>
            <span class="card-arrow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M7 7h10v10"/></svg>
            </span>
          </div>
        </a>

        <!-- 2. KANJI -->
        <a href="#kanji" class="neo-card card-kanji" id="btnKanji" data-tilt>
          <span class="card-index">02</span>
          <div class="icon-box">
            <!-- Ikon Kuil Torii / Struktur Kanji -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6c5 1.5 13 1.5 18 0"/>
              <path d="M5 10h14"/>
              <path d="M7 6v15"/>
              <path d="M17 6v15"/>
              <path d="M12 6v4"/>
            </svg>
          </div>
          <div class="card-footer">
            <h2 class="card-title">Kanji</h2>
            <span class="card-arrow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
            </span>
          </div>
        </a>

        <!-- 3. KOTOBA -->
        <a href="#kotoba" class="neo-card card-kotoba" id="btnKotoba" data-tilt>
          <span class="card-index">03</span>
          <div class="icon-box">
            <!-- Ikon Kartu Flashcard / Dialog -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="14" height="15" rx="2.5"/>
              <path d="M17 8h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2"/>
              <line x1="7" y1="10" x2="13" y2="10"/>
              <line x1="7" y1="14" x2="11" y2="14"/>
            </svg>
          </div>
          <div class="card-footer">
            <h2 class="card-title">Kotoba</h2>
            <span class="card-arrow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
            </span>
          </div>
        </a>

        <!-- 4. PEMULA (KANA) -->
        <a href="Pemula/index.html" class="neo-card card-pemula tile-link" data-tilt>
          <span class="card-index">04</span>
          <div class="icon-box">
            <!-- Ikon Pena / Kompas Dasar -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2l3.2 6.6L22 9.7l-5 4.9 1.2 6.9L12 18.2 5.8 21.5 7 14.6 2 9.7l6.8-1.1L12 2z"/>
            </svg>
          </div>
          <div class="card-footer">
            <h2 class="card-title">Pemula</h2>
            <span class="card-arrow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M7 7h10v10"/></svg>
            </span>
          </div>
        </a>

      </div>
    </section>

    <!-- VIEW 2: SUBMENU KANJI (N5 & N4) -->
    <section class="view" id="viewKanji">
      <div class="sub-bar">
        <button type="button" class="back-btn" id="btnBackFromKanji" aria-label="Kembali">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <span class="sub-tag">Kanji</span>
      </div>

      <div class="bento-grid grid-2">
        <a href="Kanji/N5/index.html" class="neo-card card-kanji tile-link" data-tilt>
          <span class="card-index">LV.1</span>
          <div class="icon-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 2 7 12 12 22 7 12 2"/>
              <polyline points="2 17 12 22 22 17"/>
              <polyline points="2 12 12 17 22 12"/>
            </svg>
          </div>
          <div class="card-footer">
            <h2 class="card-title">N5</h2>
            <span class="card-arrow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M7 7h10v10"/></svg>
            </span>
          </div>
        </a>

        <a href="Kanji/N4/index.html" class="neo-card card-kanji tile-link" data-tilt>
          <span class="card-index">LV.2</span>
          <div class="icon-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
          </div>
          <div class="card-footer">
            <h2 class="card-title">N4</h2>
            <span class="card-arrow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M7 7h10v10"/></svg>
            </span>
          </div>
        </a>
      </div>
    </section>

    <!-- VIEW 3: SUBMENU KOTOBA (N5 & N4) -->
    <section class="view" id="viewKotoba">
      <div class="sub-bar">
        <button type="button" class="back-btn" id="btnBackFromKotoba" aria-label="Kembali">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <span class="sub-tag">Kotoba</span>
      </div>

      <div class="bento-grid grid-2">
        <a href="Kotoba/Minna 1/index.html" class="neo-card card-kotoba tile-link" data-tilt>
          <span class="card-index">LV.1</span>
          <div class="icon-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
          </div>
          <div class="card-footer">
            <h2 class="card-title">N5</h2>
            <span class="card-arrow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M7 7h10v10"/></svg>
            </span>
          </div>
        </a>

        <a href="../Website N5/Kotoba/Minna 2/index.html" class="neo-card card-kotoba tile-link" data-tilt>
          <span class="card-index">LV.2</span>
          <div class="icon-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
            </svg>
          </div>
          <div class="card-footer">
            <h2 class="card-title">N4</h2>
            <span class="card-arrow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M7 7h10v10"/></svg>
            </span>
          </div>
        </a>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
