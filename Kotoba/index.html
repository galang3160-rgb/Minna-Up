<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nakama Gakkou — Pilihan Materi &amp; Bab</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="cinema-body">

  <!-- AMBIENT & EFEK INTERAKTIF -->
  <div class="sun" id="sun" aria-hidden="true"></div>
  <div class="fx" id="fx" aria-hidden="true"></div>
  <canvas id="trail" aria-hidden="true"></canvas>

  <!-- TOPBAR (DIPERTAHANKAN SESUAI DESAIN YANG DISUKAI) -->
  <header class="fixed-topbar">
    <div class="topbar-capsule">

      <!-- Kiri: Tombol Back & Brand -->
      <div class="topbar-left">
        <a href="../../index.html" id="navBackBtn" class="nav-back-circle" title="Kembali" aria-label="Kembali">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
        </a>
        <a href="index.html" class="logo">
          <span class="logo-word">Nakama<b>Gakkou</b></span>
        </a>
      </div>

      <!-- Tengah: Tab Level N5 - N1 -->
      <div class="topbar-center">
        <div class="level-pills" id="levelPills" role="tablist" aria-label="Pilih Level">
          <button type="button" class="lvl-pill" data-level="N5">N5</button>
          <button type="button" class="lvl-pill" data-level="N4">N4</button>
          <button type="button" class="lvl-pill" data-level="N3">N3</button>
          <button type="button" class="lvl-pill" data-level="N2">N2</button>
          <button type="button" class="lvl-pill" data-level="N1">N1</button>
        </div>

        <!-- Tombol Ganti Buku (Muncul saat sedang di dalam Carousel Bab) -->
        <button type="button" id="backToBookBtn" class="book-switch-chip hidden">
          <span id="activeBookLabel">Minna 1</span>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Kanan: Mode Malam & Pemicu Modal Daftar Bab -->
      <div class="topbar-right">
        <button type="button" id="themeToggleBtn" class="theme-toggle-btn" aria-label="Ganti Tema" title="Ganti Mode Siang/Malam">
          <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>

        <button type="button" id="openChapterModal" class="chapter-trigger-btn hidden" aria-label="Buka Daftar Bab">
          <span class="trigger-label"><b id="currentChapterDisplay">Bab 01</b></span>
          <div class="trigger-icon-wrap">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1"/>
              <rect x="14" y="3" width="7" height="7" rx="1"/>
              <rect x="14" y="14" width="7" height="7" rx="1"/>
              <rect x="3" y="14" width="7" height="7" rx="1"/>
            </svg>
          </div>
        </button>
      </div>

    </div>
  </header>

  <!-- =====================================================================
       TAMPILAN 1: LAYAR PILIH KATEGORI BUKU (CLEAN MONOCHROME + AMBER)
       ===================================================================== -->
  <section class="book-selection-stage" id="bookSelectionStage">
    <div class="stage-shell">
      <div class="stage-heading">
        <span class="stage-pill" id="stageLevelBadge">JLPT N5</span>
        <h1 class="stage-title" id="stageMainTitle">Pilih Buku Materi</h1>
      </div>

      <div class="book-bento-grid" id="bookBentoGrid">
        <!-- 2 Kartu Buku di-generate otomatis oleh JS -->
      </div>
    </div>
  </section>

  <!-- =====================================================================
       TAMPILAN 2: LAYERED DECK & QUICK-JUMP STRIP BAB
       ===================================================================== -->
  <main class="flashcard-stage hidden" id="chapterCarouselStage">
    <div class="deck-layout">

      <div class="deck-stage-row">
        <button type="button" class="nav-arrow-btn prev-btn" id="prevBtn" aria-label="Bab Sebelumnya">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>

        <div class="carousel-container" id="carouselContainer"></div>

        <button type="button" class="nav-arrow-btn next-btn" id="nextBtn" aria-label="Bab Selanjutnya">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </button>
      </div>

      <!-- Dock Bawah: Progress + Quick-Jump -->
      <div class="deck-dock">
        <div class="deck-dock-top">
          <button type="button" class="dock-arrow-btn" id="prevBtnMobile" aria-label="Bab Sebelumnya">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 18l-6-6 6-6"/>
            </svg>
          </button>

          <div class="deck-progress-track">
            <div class="deck-progress-fill" id="deckProgressFill"></div>
          </div>

          <button type="button" class="dock-arrow-btn" id="nextBtnMobile" aria-label="Bab Selanjutnya">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 18l6-6-6-6"/>
            </svg>
          </button>
        </div>

        <div class="quick-jump-strip" id="quickJumpStrip" aria-label="Navigasi Cepat Bab"></div>
      </div>

    </div>
  </main>

  <!-- MODAL VISUAL GRID BAB (BOTTOM SHEET DI HP) -->
  <div class="modal-backdrop" id="chapterModal" role="dialog" aria-modal="true" aria-labelledby="modalTitleLabel">
    <div class="modal-sheet">
      <div class="modal-handle" aria-hidden="true"></div>
      <div class="modal-header">
        <div>
          <span class="modal-tag" id="modalTagLabel">N5 • MINNA 1</span>
          <h3 class="modal-title" id="modalTitleLabel">Pilih Bab</h3>
        </div>
        <button type="button" class="modal-close-btn" id="closeChapterModal" aria-label="Tutup">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div class="modal-grid" id="modalChapterGrid"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
