<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nihonggo Gakkou — Pilihan Kanji Part</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;900&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="cinema-body">

  <!-- BACKGROUND VIDEO / AMBIENT -->
  <div class="video-backdrop">
    <video autoplay muted loop playsinline class="bg-video">
      <source src="../../Video/background.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>
  </div>

  <!-- AMBIENT ORB & MOUSE TRAIL -->
  <div class="sun" id="sun" aria-hidden="true"></div>
  <div class="fx" id="fx" aria-hidden="true"></div>
  <canvas id="trail"></canvas>

  <!-- NAVBAR KAPSUL NEO-BRUTALISM -->
  <header class="fixed-topbar">
    <div class="topbar-capsule">
      
      <!-- Kiri: Tombol Back & Logo -->
      <div class="topbar-left">
        <a href="../../index.html" class="nav-back-circle" title="Kembali" aria-label="Kembali ke Menu Utama">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
        </a>
        <a href="index.html" class="logo">
          <span class="logo-word">Nihonggo<b>Gakkou</b></span>
        </a>
      </div>

      <!-- Kanan: Tombol Tema & Modal Trigger -->
      <div class="topbar-right">
        <button id="themeToggle" class="theme-btn" aria-label="Ganti Tema">
          <svg class="moon-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="sun-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>

        <button type="button" id="openChapterModal" class="chapter-trigger-btn" aria-label="Buka Daftar Kanji Part">
          <span class="trigger-label">Kanji <b id="currentChapterDisplay">Part 01</b></span>
          <div class="trigger-icon-wrap">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1.5"/>
              <rect x="14" y="3" width="7" height="7" rx="1.5"/>
              <rect x="14" y="14" width="7" height="7" rx="1.5"/>
              <rect x="3" y="14" width="7" height="7" rx="1.5"/>
            </svg>
          </div>
        </button>
      </div>

    </div>
  </header>

  <!-- KONTEN UTAMA: SLIDER CAROUSEL KARTU -->
  <main class="flashcard-stage">
    <button type="button" class="nav-arrow-btn prev-btn" id="prevBtn" aria-label="Part Sebelumnya">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>

    <div class="carousel-container" id="carouselContainer"></div>

    <button type="button" class="nav-arrow-btn next-btn" id="nextBtn" aria-label="Part Selanjutnya">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </button>
  </main>

  <!-- MODAL VISUAL GRID LEVEL 1-25 -->
  <div class="modal-backdrop" id="chapterModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <div>
          <span class="modal-tag">DAFTAR MATERI KANJI</span>
          <h3 class="modal-title">Pilih Kanji Part</h3>
        </div>
        <button type="button" class="modal-close-btn" id="closeChapterModal" aria-label="Tutup">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Grid Part di-generate via JS -->
      <div class="modal-grid" id="modalChapterGrid"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
