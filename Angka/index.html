<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Nakama Gakkou — Topik Bilangan &amp; Satuan N5</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="cinema-body">

  <!-- LOADING MASUK RINGAN & LUCU -->
  <div id="entryLoader" class="entry-loader" role="status" aria-live="polite" aria-label="Memuat materi angka N5">
    <div class="loader-wrap">
      <div class="loader-mascot" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none">
          <circle cx="17" cy="36" r="4.5" fill="#FDA4AF" opacity="0.85"/>
          <circle cx="47" cy="36" r="4.5" fill="#FDA4AF" opacity="0.85"/>
          <g class="mascot-eyes">
            <circle cx="22" cy="27" r="3.8" fill="#111111"/>
            <circle cx="42" cy="27" r="3.8" fill="#111111"/>
            <circle cx="23.2" cy="25.6" r="1.2" fill="#FFFFFF"/>
            <circle cx="43.2" cy="25.6" r="1.2" fill="#FFFFFF"/>
          </g>
          <path d="M25 36.5c2.2 3.2 11.8 3.2 14 0" stroke="#111111" stroke-width="3.2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="loader-shadow" aria-hidden="true"></div>
      <div class="loader-pill">
        <span>Menyiapkan Angka</span>
        <span class="loader-dots" aria-hidden="true">
          <i></i><i></i><i></i>
        </span>
      </div>
    </div>
  </div>

  <!-- TRANSISI TIRAI PINDAH HALAMAN (SINKRON WEB UTAMA) -->
  <div id="pageTransition" class="page-transition" aria-hidden="true">
    <div class="pt-curtain"></div>
    <div class="pt-content">
      <div class="pt-icon-box" id="ptIconBox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </div>
      <span class="pt-label" id="ptLabel">Memuat...</span>
    </div>
  </div>

  <!-- AMBIENT SUBTLE GLOW -->
  <div class="sun" id="sun" aria-hidden="true"></div>

  <!-- TOPBAR FLOATING PILL + SHRINK ON SCROLL -->
  <header class="fixed-topbar" id="fixedTopbar">
    <div class="topbar-capsule">

      <!-- Kiri: Tombol Back & Brand -->
      <div class="topbar-left">
        <a href="../../index.html" id="navBackBtn" class="nav-back-circle" title="Kembali ke Menu Utama" aria-label="Kembali ke Menu Utama">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
        </a>
        <a href="index.html" class="logo" id="brandHomeLink">
          <span class="logo-word">Nakama<b>Gakkou</b></span>
        </a>
      </div>

      <!-- Tengah: Filter Kategori Topik -->
      <div class="topbar-center">
        <div class="filter-pills" id="filterPills" role="tablist" aria-label="Filter Topik Angka">
          <button type="button" class="filter-pill active" data-filter="all" role="tab" aria-selected="true">
            Semua <span class="pill-count" id="countAll">17</span>
          </button>
          <button type="button" class="filter-pill" data-filter="waktu" role="tab" aria-selected="false">
            Waktu <span class="pill-count" id="countWaktu">7</span>
          </button>
          <button type="button" class="filter-pill" data-filter="satuan" role="tab" aria-selected="false">
            Satuan <span class="pill-count" id="countSatuan">10</span>
          </button>
        </div>
      </div>

      <!-- Kanan: Badge N5 & Mode Malam -->
      <div class="topbar-right">
        <span class="nav-info-pill" aria-label="JLPT N5 Angka">N5 • 数字</span>

        <button type="button" id="themeToggle" class="theme-toggle-btn" aria-label="Ganti Tema" title="Ganti Mode Siang/Malam">
          <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
      </div>

    </div>
  </header>

  <!-- GRID TOPIK BILANGAN & SATUAN -->
  <main class="topic-stage" id="topicStage">
    <div class="stage-shell">
      <div class="stage-heading stagger-item">
        <div class="stage-badges">
          <span class="stage-pill">JLPT N5</span>
          <span class="stage-jp-pill" lang="ja">数え方・時間</span>
        </div>
        <h1 class="stage-title">Bilangan &amp; Satuan</h1>
      </div>

      <!-- Kolom Pencarian -->
      <div class="search-bar-wrap stagger-item">
        <div class="search-box">
          <span class="search-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
          </span>
          <input
            type="search"
            id="topicSearchInput"
            class="search-input"
            placeholder="Cari topik, satuan, atau kanji..."
            autocomplete="off"
            aria-label="Cari topik bilangan dan satuan"
          >
          <button type="button" id="searchClearBtn" class="search-clear-btn hidden" aria-label="Hapus pencarian" title="Hapus">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="topic-grid" id="topicGrid">
        <!-- 17 Kartu Topik di-generate otomatis oleh JS -->
      </div>

      <!-- Tampilan Jika Pencarian Tidak Ditemukan -->
      <div class="empty-state hidden" id="emptyState">
        <p class="empty-title">Topik tidak ditemukan</p>
        <p class="empty-desc">Coba kata kunci lain seperti <b>Angka</b>, <b>Jam</b>, <b>Tanggal</b>, atau <b>Lembar</b>.</p>
        <button type="button" id="resetSearchBtn" class="reset-search-btn">Reset Pencarian</button>
      </div>
    </div>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
