<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>NAKAMAGAKKOU — Level N5</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;900&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="cinema-body">

  <!-- AMBIENT & EFEK INTERAKTIF -->
  <div class="sun" id="sun" aria-hidden="true"></div>
  <div class="fx" id="fx" aria-hidden="true"></div>
  <canvas id="trail"></canvas>

  <!-- TOPBAR KAPSUL NEO-BRUTALISM -->
  <header class="fixed-topbar">
    <div class="topbar-capsule">
      
      <!-- Sisi Kiri: Tombol Back & Headline -->
      <div class="topbar-left">
        <a href="../../index.html" class="capsule-back-btn" title="Kembali ke Menu Utama" aria-label="Kembali ke Menu Utama">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
        </a>
        <div class="headline-box">
          <span class="headline-title">NAKAMA<b>GAKKOU</b></span>
          <span class="headline-badge" id="topbarBadge">Angka</span>
        </div>
      </div>

      <!-- Sisi Kanan -->
      <div class="topbar-right">
        <!-- TOMBOL GANTI TEMA -->
        <button id="themeToggle" class="theme-btn" aria-label="Ganti Tema">
          <svg class="moon-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="sun-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>

        <div class="chapter-select-wrap">
          <div class="custom-select-box">
            <select id="chapterSelect" class="chapter-dropdown" aria-label="Pilih Topik Pembelajaran">
              <!-- JS mengisi opsi bab -->
            </select>
            <div class="dropdown-chevron">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            </div>
          </div>
        </div>
        
        <div class="counter-box" id="counterBox">
          <span id="currentCardIndex">01</span><span class="sep">/</span><span id="totalCardsCount">17</span>
        </div>
      </div>

    </div>
  </header>

  <!-- KONTEN TENGAH: SLIDER CAROUSEL KARTU -->
  <main class="flashcard-stage">
    
    <!-- Tombol Kiri -->
    <button type="button" class="nav-arrow-btn prev-btn" id="prevBtn" aria-label="Sebelumnya">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>

    <!-- Container Slider Kartu -->
    <div class="carousel-container" id="carouselContainer"></div>

    <!-- Tombol Kanan -->
    <button type="button" class="nav-arrow-btn next-btn" id="nextBtn" aria-label="Selanjutnya">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>

  </main>

  <script src="script.js"></script>
</body>
</html>
