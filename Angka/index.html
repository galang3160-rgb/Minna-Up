<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Nakama Gakkou — Topik Bilangan &amp; Satuan N5</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;900&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="cinema-body">

  <!-- TRANSISI TIRAI PINDAH HALAMAN (SINKRON WEB UTAMA) -->
  <div id="pageTransition" class="page-transition" aria-hidden="true">
    <div class="pt-curtain"></div>
    <div class="pt-content">
      <div class="pt-icon-box" id="ptIconBox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </div>
      <span class="pt-label" id="ptLabel">Memuat...</span>
    </div>
  </div>

  <!-- AMBIENT & EFEK INTERAKTIF -->
  <div class="sun" id="sun" aria-hidden="true"></div>
  <div class="fx" id="fx" aria-hidden="true"></div>
  <canvas id="trail" aria-hidden="true"></canvas>

  <!-- TOPBAR KAPSUL NEO-BRUTALISM -->
  <header class="fixed-topbar">
    <div class="topbar-capsule">

      <!-- Sisi Kiri: Tombol Back & Headline -->
      <div class="topbar-left">
        <a href="../../index.html" id="navBackBtn" class="capsule-back-btn" title="Kembali ke Menu Utama" aria-label="Kembali ke Menu Utama">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
        </a>
        <div class="headline-box">
          <span class="headline-title">Nakama<b>Gakkou</b></span>
          <span class="headline-badge" id="topbarBadge">N5 • Angka</span>
        </div>
      </div>

      <!-- Sisi Kanan: Tema, Pemicu Modal Topik & Counter -->
      <div class="topbar-right">
        <button type="button" id="themeToggle" class="theme-btn" aria-label="Ganti Tema" title="Ganti Mode Siang/Malam">
          <svg class="moon-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <svg class="sun-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>

        <!-- Tombol Pemicu Modal Grid 17 Topik -->
        <button type="button" id="openTopicModal" class="topic-trigger-btn" aria-label="Buka Daftar Topik">
          <span class="trigger-label"><b id="currentTopicLabel">Angka</b></span>
          <div class="trigger-icon-wrap">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1"/>
              <rect x="14" y="3" width="7" height="7" rx="1"/>
              <rect x="14" y="14" width="7" height="7" rx="1"/>
              <rect x="3" y="14" width="7" height="7" rx="1"/>
            </svg>
          </div>
        </button>

        <div class="counter-box" id="counterBox">
          <span id="currentCardIndex">01</span><span class="sep">/</span><span id="totalCardsCount">17</span>
        </div>
      </div>

    </div>
  </header>

  <!-- KONTEN TENGAH: SLIDER CAROUSEL KARTU -->
  <main class="flashcard-stage">

    <!-- Tombol Kiri -->
    <button type="button" class="nav-arrow-btn prev-btn" id="prevBtn" aria-label="Sebelumnya">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>

    <!-- Container Slider Kartu -->
    <div class="carousel-container" id="carouselContainer"></div>

    <!-- Tombol Kanan -->
    <button type="button" class="nav-arrow-btn next-btn" id="nextBtn" aria-label="Selanjutnya">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </button>

  </main>

  <!-- MODAL POPUP GRID 17 TOPIK BILANGAN & SATUAN -->
  <div class="modal-backdrop" id="topicModal" role="dialog" aria-modal="true" aria-labelledby="topicModalTitle">
    <div class="modal-sheet">
      <div class="modal-handle" aria-hidden="true"></div>
      <div class="modal-header">
        <div>
          <span class="modal-tag">17 TOPIK HITUNGAN N5</span>
          <h3 class="modal-title" id="topicModalTitle">Pilih Topik Pembelajaran</h3>
        </div>
        <button type="button" class="modal-close-btn" id="closeTopicModal" aria-label="Tutup">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div class="modal-grid" id="modalTopicGrid"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
